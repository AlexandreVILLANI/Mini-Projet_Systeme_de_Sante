{% extends "base.html" %}

{% block title %}Connexion - WellMind-Lab{% endblock %}

{% block content %}
<div class="container">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 overflow-hidden">
                <div class="card-header bg-primary text-white text-center py-4">
                    <i class="bi bi-shield-lock-fill fs-1 mb-2 d-block"></i>
                    <h3 class="fw-bold mb-1">Connexion</h3>
                    <p class="text-white-50 small mb-0">Accédez à votre espace d'évaluation</p>
                </div>
                
                <div class="card-body p-4 p-md-5">
                    <form method="post" action="{% url 'comptes:connexion' %}">
                        {% csrf_token %}
                        
                        <div class="mb-3">
                            <label for="username" class="form-label fw-semibold">Adresse Email ou Identifiant</label>
                            <div class="input-group">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-person-fill"></i></span>
                                <input type="text" class="form-control border-start-0" id="username" name="username" placeholder="exemple@domaine.fr" required>
                            </div>
                        </div>
                        
                        <div class="mb-3">
                            <div class="d-flex justify-content-between align-items-center">
                                <label for="password" class="form-label fw-semibold mb-0">Mot de passe</label>
                                <a href="#" class="small text-muted text-decoration-none">Mot de passe oublié ?</a>
                            </div>
                            <div class="input-group mt-1">
                                <span class="input-group-text bg-light border-end-0"><i class="bi bi-key-fill"></i></span>
                                <input type="password" class="form-control border-start-0" id="password" name="password" placeholder="••••••••" required>
                            </div>
                        </div>
                        
                        <div class="mb-4 form-check">
                            <input type="checkbox" class="form-check-input" id="remember" name="remember">
                            <label class="form-check-label small text-muted" for="remember">Se souvenir de moi</label>
                        </div>
                        
                        <button type="submit" class="btn btn-primary w-100 py-2 fw-semibold rounded-pill shadow-sm">
                            <i class="bi bi-box-arrow-in-right me-1"></i> Se connecter
                        </button>
                    </form>
                    
                    <hr class="my-4 text-muted">
                    
                    <div class="text-center">
                        <span class="text-muted small">Vous n'avez pas encore de compte ?</span>
                        <a href="{% url 'comptes:inscription' %}" class="fw-semibold text-primary text-decoration-none ms-1">
                            Créer un compte
                        </a>
                    </div>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
